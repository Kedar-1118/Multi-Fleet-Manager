# MCTS Configuration

mcts:
  num_simulations: 50            # Number of MCTS simulations per decision
  max_depth: 10                  # Maximum tree depth
  exploration_constant: 1.414    # UCB1 exploration constant (sqrt(2))
  rollout_horizon: 5             # Steps to simulate during rollout
  discount_factor: 0.99          # Discount for future rewards in rollout
  temperature: 1.0               # Action selection temperature

hybrid:
  top_k_actions: 10              # Top-K actions from PPO as MCTS candidates
  latency_budget_ms: 45.0        # Maximum allowed latency per decision
  fallback_to_ppo: true          # Use PPO directly if MCTS exceeds budget
  use_ppo_priors: true           # Use PPO probabilities as MCTS priors
  prior_weight: 0.5              # Weight of PPO prior in UCB calculation

ablation:
  small_budget:
    num_simulations: 10
    max_depth: 5
    rollout_horizon: 3
  large_budget:
    num_simulations: 200
    max_depth: 15
    rollout_horizon: 10
