[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-fleet-routing"
version = "1.0.0"
description = "Dynamic Fleet Dispatch & Vehicle Routing Optimization via Deep RL & MCTS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Fleet Routing Team"}
]
keywords = ["reinforcement-learning", "vehicle-routing", "mcts", "ppo", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "networkx>=3.1",
    "gymnasium>=0.29.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "stable-baselines3>=2.1.0",
    "sb3-contrib>=2.1.0",
    "ortools>=9.7",
    "mlflow>=2.8.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
tuning = ["ray[tune]>=2.8.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]
all = ["dynamic-fleet-routing[tuning,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]
