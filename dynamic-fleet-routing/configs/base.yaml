# Base configuration for Dynamic Fleet Routing
# All parameters can be overridden by environment-specific configs

simulation:
  num_nodes: 50                  # Number of city graph nodes
  num_vehicles: 5                # Number of fleet vehicles
  requests_per_day: 100          # Target requests per simulated day
  simulation_duration: 1440      # Minutes in a simulated day (24 hours)
  time_step_minutes: 1           # Simulation time granularity
  seed: 42

city:
  grid_size: 10.0                # City area in km (grid_size x grid_size)
  edge_density: 0.15             # Probability of edge between nodes
  min_edge_weight: 1.0           # Minimum road distance (km)
  max_edge_weight: 5.0           # Maximum road distance (km)
  base_speed_kmh: 30.0           # Base vehicle speed in km/h

traffic:
  rush_hour_windows:
    - start: 480                 # 08:00 in minutes
      end: 600                   # 10:00 in minutes
      multiplier: 2.0
    - start: 1020                # 17:00 in minutes
      end: 1200                  # 20:00 in minutes
      multiplier: 2.5
  congestion_probability: 0.05   # Random congestion event probability
  noise_std: 0.1                 # Travel time noise standard deviation
  traffic_update_interval: 30    # Minutes between traffic state updates

vehicles:
  capacity: 10                   # Max packages per vehicle
  fuel_consumption_per_km: 0.08  # Fuel units per km
  service_time_minutes: 5        # Time to pick up or drop off
  initial_fuel: 100.0            # Starting fuel

requests:
  lambda_rate: 5                 # Poisson arrival rate per interval
  arrival_interval: 30           # Minutes between arrival batches
  min_deadline_minutes: 30       # Minimum SLA deadline
  max_deadline_minutes: 120      # Maximum SLA deadline
  min_package_size: 1            # Minimum package size
  max_package_size: 3            # Maximum package size
  priority_weights: [0.6, 0.3, 0.1]  # Probability of LOW, MEDIUM, HIGH

observation:
  top_k_requests: 20             # Number of request slots in observation
  max_vehicles: 10               # Maximum vehicle slots

reward:
  delivery_reward: 10.0          # α - successful delivery
  travel_penalty: 0.1            # β - per-km travel cost
  fuel_penalty: 0.5              # γ - fuel consumption cost
  sla_violation_penalty: 20.0    # δ - SLA violation cost
  idle_penalty: 0.05             # ε - per-minute idle cost
  utilization_reward: 1.0        # ζ - vehicle utilization bonus
  expiry_penalty: 15.0           # Penalty for expired requests
  normalize: true                # Apply reward normalization
  normalization_window: 100      # Window for running stats

benchmark:
  small:
    num_nodes: 50
    num_vehicles: 5
    requests_per_day: 100
  large:
    num_nodes: 500
    num_vehicles: 50
    requests_per_day: 500
